name: Idea or feature request
description: Suggest something new (a dragon, an ability, a config option, …)
labels: [enhancement]
body:
  - type: textarea
    id: idea
    attributes:
      label: Your idea
      description: What should Dragons do, and why would it make the game better?
    validations:
      required: true
  - type: input
    id: setup
    attributes:
      label: Minecraft version and loader you play on
      placeholder: e.g. 1.21.1 Fabric
